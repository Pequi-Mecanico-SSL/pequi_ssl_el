launch:

- arg:
    name: "blue_robot_count"
    default: "3"
- arg:
    name: "yellow_robot_count"
    default: "3"
- arg:
    name: "frequency"
    default: "60"
- arg:
    name: "vision_ip"
    default: "224.5.23.2"
- arg:
    name: "vision_port"
    # 10006 = real ssl-vision (our config); 10020 = grSim (grsim-rig)
    default: "10006"

- node:
    pkg: "ssl_vision_connector"
    exec: "protobuf_to_ros"
    name: "protobuf_to_ros"
    param:
    -
        name: blue_robot_count
        value: $(var blue_robot_count)
    -
        name: yellow_robot_count
        value: $(var yellow_robot_count)
    -
        name: frequency
        value: $(var frequency)
    -
        name: vision_ip
        value: $(var vision_ip)
    -
        name: vision_port
        value: $(var vision_port)

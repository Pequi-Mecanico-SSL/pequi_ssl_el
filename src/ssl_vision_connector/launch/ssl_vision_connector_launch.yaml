launch:

- arg:
    name: "blue_robot_count"
    default: "3"
- arg:
    name: "yellow_robot_count"
    default: "3"
- arg:
    name: "frequency"
    default: "60"
- arg:
    name: "vision_ip"
    default: "224.5.23.2"
- arg:
    name: "vision_port"
    # 10006 = real ssl-vision (our config); 10020 = grSim default
    default: "10006"
- arg:
    name: "mirror"
    # true = correct our mirrored real-camera calibration; false for grSim
    default: "true"
- arg:
    # address of the interface to join the multicast group on (0.0.0.0 = default route; a simulator on its own docker network: that network's host address)
    name: "vision_iface"
    default: "0.0.0.0"

- node:
    pkg: "ssl_vision_connector"
    exec: "protobuf_to_ros"
    name: "protobuf_to_ros"
    param:
    -
        name: blue_robot_count
        value: $(var blue_robot_count)
    -
        name: yellow_robot_count
        value: $(var yellow_robot_count)
    -
        name: frequency
        value: $(var frequency)
    -
        name: vision_ip
        value: $(var vision_ip)
    -
        name: vision_port
        value: $(var vision_port)
    -
        name: mirror
        value: $(var mirror)
    -
        name: vision_iface
        value: $(var vision_iface)

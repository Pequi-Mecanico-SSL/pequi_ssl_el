launch:

# the robot's number: its nodes and topics live in /robot<id> (/robot1/cmd_vel, /robot1/odom, ...)
- arg:
    name: "robot_id"
    default: "$(env ROBOT_ID)"

# robot model: wheel layout, friction, limits
- arg:
    name: "config"
    default: "$(find-pkg-share robot_control)/config/three_wheel.yaml"

- node:
    pkg: "robot_control"
    exec: "drive"
    name: "drive"
    namespace: "robot$(var robot_id)"
    param:
    -
        from: "$(var config)"
    -
        name: "i2c_bus"
        value: "$(env IMU_I2C_BUS 1)"
    respawn: "true"
    respawn_delay: 1.0

- node:
    pkg: "robot_control"
    exec: "teleop"
    name: "teleop"
    namespace: "robot$(var robot_id)"
    param:
    -
        from: "$(var config)"

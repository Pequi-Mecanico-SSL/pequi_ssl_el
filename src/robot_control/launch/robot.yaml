launch:

- node:
    pkg: "robot_control"
    exec: "can_bridge"
    name: "can_bridge"

- node:
    pkg: "robot_control"
    exec: "imu"
    name: "imu"

- node:
    pkg: "robot_control"
    exec: "velocity_controller"
    name: "velocity_controller"

- node:
    pkg: "robot_control"
    exec: "kinematics"
    name: "kinematics"
    remap:
    -
        from: "cmd_vel"
        to: "cmd_vel_corrected"

- node:
    pkg: "robot_control"
    exec: "teleop"
    name: "teleop"

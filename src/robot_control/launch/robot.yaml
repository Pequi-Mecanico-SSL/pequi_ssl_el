launch:

# robot model: wheel layout, friction, limits
- arg:
    name: "config"
    default: "$(find-pkg-share robot_control)/config/three_wheel.yaml"

- node:
    pkg: "robot_control"
    exec: "drive"
    name: "drive"
    param:
    -
        from: "$(var config)"
    -
        name: "i2c_bus"
        value: "$(env IMU_I2C_BUS 1)"
    respawn: "true"
    respawn_delay: 1.0

- node:
    pkg: "robot_control"
    exec: "teleop"
    name: "teleop"
    param:
    -
        from: "$(var config)"

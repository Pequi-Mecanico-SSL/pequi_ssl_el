launch:

- node:
    pkg: "robot_control"
    exec: "can_bridge"
    name: "can_bridge"
    respawn: "true"
    respawn_delay: 1.0

- node:
    pkg: "robot_control"
    exec: "imu"
    name: "imu"
    param:
    -
        name: "i2c_bus"
        value: "$(env IMU_I2C_BUS 1)"
    respawn: "true"
    respawn_delay: 1.0

- node:
    pkg: "robot_control"
    exec: "odometry"
    name: "odometry"

- node:
    pkg: "robot_control"
    exec: "robot_events"
    name: "robot_events"

- node:
    pkg: "robot_control"
    exec: "velocity_controller"
    name: "velocity_controller"
    param:
    -
        # true: heading/omega from the odometry node (gyro + wheels)
        # false: this node's own gyro integration (previous behavior)
        name: use_odom
        value: false

- node:
    pkg: "robot_control"
    exec: "kinematics"
    name: "kinematics"
    remap:
    -
        from: "cmd_vel"
        to: "cmd_vel_corrected"

- node:
    pkg: "robot_control"
    exec: "teleop"
    name: "teleop"

launch:

# robot model: a file of config/ (wheel layout, motor count, tuning)
- arg:
    name: "config"
    default: "$(find-pkg-share robot_control)/config/$(env ROBOT_CONFIG four_wheel).yaml"

# one process for motors, IMU and motion control (replaces can_bridge, imu, velocity_controller, kinematics)
- node:
    pkg: "robot_control"
    exec: "drive"
    name: "drive"
    param:
    -
        from: "$(var config)"
    -
        name: "i2c_bus"
        value: "$(env IMU_I2C_BUS 1)"
    respawn: "true"
    respawn_delay: 1.0

- node:
    pkg: "robot_control"
    exec: "teleop"
    name: "teleop"
    param:
    -
        from: "$(var config)"

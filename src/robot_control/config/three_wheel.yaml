# 3-wheel robot, wheels 120 degrees apart. Motor ids: 0 front-left, 1 front-right, 2 back.
# "/**/<node>": the node in any namespace (a bare node name is not found inside /robot<id>).
"/**/can_bridge":
  ros__parameters:
    n_motors: 3
    # peak; ESC firmware 10 brings it down to 3 A when the 10 s mean current gets there
    current_limit_a: 5.0

"/**/kinematics":
  ros__parameters:
    # calibrated with the overhead camera (2026-11-25)
    wheel_angles_deg: [61.4, -59.1, 180.9]
    robot_radius: [0.0763, 0.0740, 0.0822]
    wheel_radius: [0.02283, 0.02222, 0.02349]

"/**/drive":
  ros__parameters:
    # geometry, slip and friction fitted on the field carpet with the overhead camera (2026-11-26)
    wheel_angles_deg: [60.93, -61.73, 179.68]
    robot_radius: [0.0842, 0.0830, 0.0833]
    wheel_radius: [0.02434, 0.02410, 0.02405]
    oblique_loss: [0.158, 0.184, 0.129]
    creep: [0.060, 0.064, 0.046]
    mass: 1.6
    inertia: 0.0062
    roller_friction: [1.17, 1.16, 1.41]
    rolling_current: [0.30, 0.33, 0.26]
    # fitted on the field carpet with the camera (2026-11-27). The wheels creep well before they let go:
    # this grip lets the front wheels run up to 0.4 m/s ahead of the ground accelerating forward
    efficiency: 0.76
    grip: 1.0
    com: [-0.010, 0.0]
    com_height: 0.05
    # ESC limit = this x 1.25 = the 5 A of can_bridge
    current_limit_a: 4.0

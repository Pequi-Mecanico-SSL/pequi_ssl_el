services:
  ping:
    container_name: ssl_ping
    build:
      context: .
      dockerfile: Dockerfile.arm64
    command: ros2 run latency_test ping
    network_mode: host
    ipc: host
    volumes:
      - ./src:/ssl_ws/src:ro

  bash:
    container_name: ssl_bash
    build:
      context: .
      dockerfile: Dockerfile.arm64
    command: bash
    network_mode: host
    ipc: host
    volumes:
      - ./src:/ssl_ws/src
      - /dev/input:/dev/input:rw
      - /dev/bus/usb:/dev/bus/usb:rw
    environment:
      - DISPLAY=:0.0
      - SDL_AUDIODRIVER=dsp

  pong:
    container_name: ssl_pong
    build:
      context: .
      dockerfile: Dockerfile.arm64
    command: ros2 run latency_test pong
    network_mode: host
    ipc: host
    volumes:
      - ./src:/ssl_ws/src:ro

  robot:
    container_name: ssl_robot
    privileged: true
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.arm64
    # clean build: a power cut mid-write can leave truncated files in
    # build/install that incremental builds never repair (mtime-based skip)
    command: bash -lc 'rm -rf /ssl_ws/build /ssl_ws/install && colcon build --packages-select robot_control && ros2 launch robot_control robot.yaml'
    network_mode: host
    ipc: host
    volumes:
      - ./src:/ssl_ws/src:ro
      - /dev:/dev:rw
    environment:
      # I2C bus of the IMU: 1 on the Raspberry Pi 4, 0 on the Orange Pi 4 Pro (set in .env)
      - IMU_I2C_BUS=${IMU_I2C_BUS:-1}
  
  simulator:
    container_name: ssl_simulator
    privileged: true
    build:
      context: .
      dockerfile: Dockerfile.x86
    command: ros2 launch rsim_ros simulator_launch.yaml
    network_mode: host
    ipc: host
    volumes:
      - ./src:/ssl_ws/src:ro
      - /dev/input:/dev/input:rw
      - /dev/bus/usb:/dev/bus/usb:rw
    environment:
      - DISPLAY=:0.0
      - SDL_AUDIODRIVER=dsp
    devices:
      - /dev/input/js0:/dev/input/js0

  gamepad:
    container_name: ssl_gamepad
    privileged: true
    build:
      context: .
      dockerfile: Dockerfile.x86
    command: ros2 launch rsim_ros gamepad.yaml
    network_mode: host
    ipc: host
    volumes:
      - ./src:/ssl_ws/src:ro
      - /dev/input:/dev/input:rw
      - /dev/bus/usb:/dev/bus/usb:rw
    environment:
      - DISPLAY=:0.0
      - SDL_AUDIODRIVER=dsp
    devices:
      - /dev/input/js0:/dev/input/js0
  
  control:
    container_name: ssl_control
    build:
      context: .
      dockerfile: Dockerfile.x86
    command: ros2 run robot_control controller
    network_mode: host
    ipc: host
    volumes:
      - ./src:/ssl_ws/src:ro

  strategy:
    container_name: ssl_strategy
    build:
      context: .
      dockerfile: Dockerfile.x86
    command: ros2 run strategy rl
    network_mode: host
    ipc: host
    volumes:
      - ./src:/ssl_ws/src
      - /dev/input:/dev/input:rw
      - /dev/bus/usb:/dev/bus/usb:rw
    environment:
      - DISPLAY=:0.0
      - SDL_AUDIODRIVER=dsp

  # RL strategy: vendored RL policy driving /<team>/robot<i>/cmd_vel from
  # /vision/poses/*. Topics carry real-world SI; the training-frame scaling is
  # internal to the package.
  rl_strategy:
    container_name: ssl_rl_strategy
    build:
      context: .
      dockerfile: Dockerfile.x86
    command: ros2 launch rl_strategy rl_strategy_launch.yaml
    network_mode: host
    ipc: host
    volumes:
      - ./src:/ssl_ws/src:ro

  # Vision input adapter: SSL wire-protocol UDP -> /vision/poses/* topics
  # (real-world SI, right-handed). Real ssl-vision (:10006, mirror on) by
  # default. For grSim:
  #   docker compose run vision_connector ros2 launch ssl_vision_connector \
  #       ssl_vision_connector_launch.yaml vision_port:=10020 mirror:=false
  vision_connector:
    container_name: ssl_vision_connector
    build:
      context: .
      dockerfile: Dockerfile.x86
    command: ros2 launch ssl_vision_connector ssl_vision_connector_launch.yaml
    network_mode: host
    ipc: host
    volumes:
      - ./src:/ssl_ws/src:ro

  # Per-robot EKF over vision: /vision/stamped/* (+ our cmd_vel) ->
  # /vision/filtered/* (smoothed pose, body velocity). Needs vision_connector.
  # Test without camera/simulator (see src/vision_filter/README.md):
  #   docker compose run vision_filter ros2 run vision_filter fake_vision
  vision_filter:
    container_name: ssl_vision_filter
    build:
      context: .
      dockerfile: Dockerfile.x86
    command: ros2 launch vision_filter vision_filter_launch.yaml
    network_mode: host
    ipc: host
    volumes:
      - ./src:/ssl_ws/src:ro

services:
  ping:
    container_name: ssl_ping
    build:
      context: .
      dockerfile: Dockerfile.arm64
    command: ros2 run latency_test ping
    network_mode: host
    ipc: host
    volumes:
      - ./src:/ssl_ws/src:ro

  bash:
    container_name: ssl_bash
    build:
      context: .
      dockerfile: Dockerfile.arm64
    command: bash
    network_mode: host
    ipc: host
    volumes:
      - ./src:/ssl_ws/src
      - /dev/input:/dev/input:rw
      - /dev/bus/usb:/dev/bus/usb:rw
    environment:
      - DISPLAY=:0.0
      - SDL_AUDIODRIVER=dsp

  pong:
    container_name: ssl_pong
    build:
      context: .
      dockerfile: Dockerfile.arm64
    command: ros2 run latency_test pong
    network_mode: host
    ipc: host
    volumes:
      - ./src:/ssl_ws/src:ro

  robot:
    container_name: ssl_robot
    privileged: true
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.arm64
    # clean build: a power cut mid-write can leave truncated files in
    # build/install that incremental builds never repair (mtime-based skip)
    command: bash -lc 'rm -rf /ssl_ws/build /ssl_ws/install && colcon build --packages-select robot_control && ros2 launch robot_control robot.yaml'
    network_mode: host
    ipc: host
    volumes:
      - ./src:/ssl_ws/src:ro
      - /dev:/dev:rw
    environment:
      # I2C bus of the IMU: 1 on the Raspberry Pi 4, 0 on the Orange Pi 4 Pro (set in .env)
      - IMU_I2C_BUS=${IMU_I2C_BUS:-1}
      # robot model, a file of src/robot_control/config (set in .env): four_wheel or three_wheel
      - ROBOT_CONFIG=${ROBOT_CONFIG:-four_wheel}
  
  simulator:
    container_name: ssl_simulator
    privileged: true
    build:
      context: .
      dockerfile: Dockerfile.x86
    command: ros2 launch rsim_ros simulator_launch.yaml
    network_mode: host
    ipc: host
    volumes:
      - ./src:/ssl_ws/src:ro
      - /dev/input:/dev/input:rw
      - /dev/bus/usb:/dev/bus/usb:rw
    environment:
      - DISPLAY=:0.0
      - SDL_AUDIODRIVER=dsp
    devices:
      - /dev/input/js0:/dev/input/js0

  gamepad:
    container_name: ssl_gamepad
    privileged: true
    build:
      context: .
      dockerfile: Dockerfile.x86
    command: ros2 launch rsim_ros gamepad.yaml
    network_mode: host
    ipc: host
    volumes:
      - ./src:/ssl_ws/src:ro
      - /dev/input:/dev/input:rw
      - /dev/bus/usb:/dev/bus/usb:rw
    environment:
      - DISPLAY=:0.0
      - SDL_AUDIODRIVER=dsp
    devices:
      - /dev/input/js0:/dev/input/js0
  
  control:
    container_name: ssl_control
    build:
      context: .
      dockerfile: Dockerfile.x86
    command: ros2 run robot_control controller
    network_mode: host
    ipc: host
    volumes:
      - ./src:/ssl_ws/src:ro

  strategy:
    container_name: ssl_strategy
    build:
      context: .
      dockerfile: Dockerfile.x86
    command: ros2 run strategy rl
    network_mode: host
    ipc: host
    volumes:
      - ./src:/ssl_ws/src
      - /dev/input:/dev/input:rw
      - /dev/bus/usb:/dev/bus/usb:rw
    environment:
      - DISPLAY=:0.0
      - SDL_AUDIODRIVER=dsp

  # RL strategy: vendored RL policy driving /<team>/robot<i>/cmd_vel from
  # /vision/poses/*. Topics carry real-world SI; the training-frame scaling is
  # internal to the package. behavior_name:=rl publishes under
  # /<team>/behaviors/rl/ so the router relays it only while the game is running.
  rl_strategy:
    container_name: ssl_rl_strategy
    build:
      context: .
      dockerfile: Dockerfile.x86
    command: ros2 launch rl_strategy rl_strategy_launch.yaml behavior_name:=rl
    network_mode: host
    ipc: host
    volumes:
      - ./src:/ssl_ws/src:ro

  # ---- referee stack ------------------------------------------------------
  # The rules package (import sslrules, checked out at ../ssl-rules) is an
  # external package (not part of this repository): it is mounted and put on
  # PYTHONPATH here.

  # Referee input adapter: ssl-game-controller multicast (224.5.23.1:10003)
  # -> /referee/state (decoded wire message) and /referee/game_state (derived
  # state incl. ball-in-play, which needs /vision/poses/ball).
  referee_connector:
    container_name: ssl_referee_connector
    build:
      context: .
      dockerfile: Dockerfile.x86
    command: ros2 launch referee_connector referee_connector_launch.yaml
    network_mode: host
    ipc: host
    environment:
      - PYTHONPATH=/ssl_ws/ext/ssl-rules/src
    volumes:
      - ./src:/ssl_ws/src:ro
      - ../ssl-rules/src:/ssl_ws/ext/ssl-rules/src:ro

  # Behavior router for one team: game state -> active behavior; relays
  # /<team>/behaviors/<active>/robot<i>/cmd_vel to /<team>/robot<i>/cmd_vel.
  # No referee on the network -> halt (no_referee_behavior:=rl to play without one).
  router:
    container_name: ssl_router
    build:
      context: .
      dockerfile: Dockerfile.x86
    command: ros2 launch router router_launch.yaml team:=blue
    network_mode: host
    ipc: host
    environment:
      - PYTHONPATH=/ssl_ws/ext/ssl-rules/src
    volumes:
      - ./src:/ssl_ws/src:ro
      - ../ssl-rules/src:/ssl_ws/ext/ssl-rules/src:ro

  # Vision input adapter: SSL wire-protocol UDP -> /vision/poses/* topics
  # (real-world SI, right-handed). Real ssl-vision (:10006, mirror on) by
  # default. For grSim:
  #   docker compose run vision_connector ros2 launch ssl_vision_connector \
  #       ssl_vision_connector_launch.yaml vision_port:=10020 mirror:=false
  vision_connector:
    container_name: ssl_vision_connector
    build:
      context: .
      dockerfile: Dockerfile.x86
    command: ros2 launch ssl_vision_connector ssl_vision_connector_launch.yaml
    network_mode: host
    ipc: host
    volumes:
      - ./src:/ssl_ws/src:ro

  # Live dashboard: http://<host>:8093 - vision, referee, routers and the debug topics of whatever
  # behaviors publish on /<team>/behaviors/<name>/debug, with freeze and scrub.
  dashboard:
    container_name: ssl_dashboard
    build:
      context: .
      dockerfile: Dockerfile.x86
    command: ros2 launch dashboard dashboard_launch.yaml
    network_mode: host
    ipc: host
    volumes:
      - ./src:/ssl_ws/src:ro
